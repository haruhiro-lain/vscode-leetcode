name: CI

on:
  push:
    branches: [master, feat/personalization]
  pull_request:
    branches: [master, feat/personalization]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm exec --yes --package=@vscode/vsce@4.0.0 -- vsce package
